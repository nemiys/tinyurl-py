name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    # Pinned on purpose. MongoDB refuses to start on Linux kernels 6.19 to
    # 7.0.13 (https://www.mongodb.com/docs/v8.0/release-notes/8.0/), and
    # ubuntu-latest moved to such a kernel. 22.04 ships kernel 6.8. Revisit
    # when MongoDB or the runner image is fixed.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # So a future "mongo exited (1)" can be diagnosed at a glance.
      - name: Show kernel version
        run: uname -r

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python version comes from .python-version; deps from uv.lock.
      - name: Install dependencies
        run: uv sync --frozen

      # Integration tests need real Mongo and Cassandra. Reuse the exact
      # docker-compose.yml we use locally, so CI and laptop never drift apart.
      # `--wait` returns once every service reports healthy.
      - name: Start services
        run: docker compose up -d --wait

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest

      # Only when something failed: show what the containers were saying.
      - name: Service logs
        if: failure()
        run: docker compose logs --tail=100

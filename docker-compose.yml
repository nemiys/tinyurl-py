# Two ways to use this file:
#
#   docker compose up --build
#       everything: the three databases, the API (http://localhost:8001/docs)
#       and the worker that counts clicks.
#
#   docker compose up -d --wait redis mongo cassandra cassandra-init
#       only the databases, for developing and running the tests on your own
#       machine (uv run pytest, uv run uvicorn ...).

services:
  redis:
    image: redis:7
    container_name: tinyurl-py-redis
    ports:
      - "6381:6379" # 6379 is used by the old nemiys-tinyurl, 6380 by wikiguard-py
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    container_name: tinyurl-py-mongo
    ports:
      - "27018:27017" # 27017 is used by the old nemiys-tinyurl
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:5
    container_name: tinyurl-py-cassandra
    ports:
      - "9043:9042" # 9042 is used by the old nemiys-tinyurl
    environment:
      # Cassandra defaults to using a large part of the machine's RAM; this
      # is a local dev instance, so keep it small.
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # One-shot helper: waits for Cassandra, applies the schema, then exits.
  cassandra-init:
    image: cassandra:5
    container_name: tinyurl-py-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/schema.cql:/schema.cql:ro
    # Inside the compose network Cassandra is reached by service name and its
    # normal port, not the host-mapped 9043.
    command: ["cqlsh", "cassandra", "9042", "-f", "/schema.cql"]
    restart: "no"

  # --- The application ---------------------------------------------------------
  # One image, two commands (see Dockerfile). Inside the compose network the other
  # services are reached by name and by their normal ports, not by the ports
  # mapped to your machine above.
  api:
    build: .
    image: tinyurl-py
    container_name: tinyurl-py-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment: &app-environment
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      BASE_URL: ${BASE_URL:-http://localhost:8001}
      # Empty means "make a random one for this run" (docker/entrypoint.sh).
      # Set it in a .env file next to this one to keep logins across restarts.
      JWT_SECRET: ${JWT_SECRET:-}
    # No Cassandra here on purpose: the API only needs it for statistics and
    # connects to it on first use, so redirects work even while it is starting.
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Counts the clicks. Stop it (`docker compose stop worker`), click some links,
  # start it again (`docker compose start worker`): nothing is lost.
  worker:
    build: .
    image: tinyurl-py
    container_name: tinyurl-py-worker
    restart: unless-stopped
    command: ["python", "-m", "tinyurl_py.worker"]
    environment: *app-environment
    depends_on:
      redis:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully

volumes:
  mongo-data:
  cassandra-data:
